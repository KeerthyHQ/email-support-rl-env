<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Email Support Evaluation Environment</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            min-height: 100vh;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
        }

        .subtitle {
            color: gray;
            margin-bottom: 20px;
        }

        .container {
            width: 650px;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .card {
            background: #fafafa;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: none;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            margin-right: 10px;
        }

        .send-btn {
            background: #4CAF50;
            color: white;
        }

        .reset-btn {
            background: #2196F3;
            color: white;
        }

        #history {
            height: 220px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            background: #fafafa;
        }

        .metric {
            margin: 5px 0;
        }

        #status {
            color: green;
            font-weight: bold;
        }

    </style>
</head>

<body>

<h1>🤖 AI Email Support Evaluation Environment</h1>

<p class="subtitle">
Evaluate customer support agents using rewards and grading metrics.
</p>

<div class="container">

    <h3 id="status">🟢 Environment Running</h3>

    <div class="card">

        <h2>📩 Customer Email</h2>

        <p id="email">Loading...</p>

    </div>

    <div class="card">

        <div class="metric">
            <b>Category:</b>
            <span id="category">-</span>
        </div>

        <div class="metric">
            <b>Priority:</b>
            <span id="priority">-</span>
        </div>

        <div class="metric">
            <b>Sentiment:</b>
            <span id="sentiment">-</span>
        </div>

        <div class="metric">
            <b>Task:</b>
            <span id="task">-</span>
        </div>

        <div class="metric">
            <b>Task Score:</b>
            <span id="task_score">0</span>
        </div>

        <div class="metric">
            <b>Keyword Matches:</b>
            <span id="matches">0</span>
        </div>

        <div class="metric">
            <b>Reward:</b>
            ⭐ <span id="reward">0</span>
        </div>

    </div>

    <h3>📜 Conversation History</h3>

    <div id="history"></div>

    <textarea
        id="reply"
        placeholder="Type your reply here..."
    ></textarea>

    <br>

    <button class="send-btn" onclick="sendReply()">
        Send Reply
    </button>

    <button class="reset-btn" onclick="resetEnvironment()">
        Reset Environment
    </button>

</div>

<script>

const BASE_URL = "";

async function resetEnvironment() {

    try {

        const response = await fetch(
            BASE_URL + "/reset",
            {
                method: "POST"
            }
        );

        const data = await response.json();

        const obs = data.observation;

        document.getElementById("email").innerText =
            obs.email;

        document.getElementById("reward").innerText =
            data.reward ?? 0;

        document.getElementById("category").innerText =
            obs.metadata.category;

        document.getElementById("priority").innerText =
            obs.metadata.priority;

        document.getElementById("sentiment").innerText =
            obs.metadata.sentiment;

        document.getElementById("task").innerText =
            obs.metadata.task ?? "-";

        document.getElementById("history").innerHTML =
            `<p><b>📩 Customer:</b> ${obs.email}</p>`;

        document.getElementById("status").innerText =
            "🟢 Environment Running";

    }

    catch (error) {

        document.getElementById("status").innerText =
            "🔴 Environment Offline";

        console.error(error);

    }
}

async function sendReply() {

    const reply =
        document.getElementById("reply").value;

    if (!reply.trim())
        return;

    const history =
        document.getElementById("history");

    history.innerHTML +=
        `<p><b>🤖 Agent:</b> ${reply}</p>`;

    const response = await fetch(
        BASE_URL + "/step",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                action: {
                    reply: reply
                }
            })
        }
    );

    const data = await response.json();

    const obs = data.observation;

    document.getElementById("reward").innerText =
        data.reward.toFixed(2);

    document.getElementById("email").innerText =
        obs.email;

    document.getElementById("task").innerText =
        obs.metadata.task ?? "-";

    document.getElementById("task_score").innerText =
        obs.metadata.task_score ?? 0;

    document.getElementById("matches").innerText =
        obs.metadata.keyword_matches ?? 0;

    history.innerHTML +=
        `<p><b>📩 Customer:</b> ${obs.email}</p>`;

    history.scrollTop =
        history.scrollHeight;

    document.getElementById("reply").value = "";

    if (data.done) {

        history.innerHTML += `
            <hr>
            <p>
                ✅ Conversation Completed
            </p>
        `;
    }
}

resetEnvironment();

</script>

</body>
</html>
